{% extends 'myapp/base.html' %}

{% block title %}Удалить запись?{% endblock %}

{% block content %}
<h1>Удалить запись?</h1>
<p>Вы уверены, что хотите удалить запись <strong>{{ object.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'index' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
