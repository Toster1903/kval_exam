{% extends 'myapp/base.html' %}

{% block title %}Список записей{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Список записей</h1>
    <a href="{% url 'create' %}" class="btn btn-primary">Добавить запись</a>
</div>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for item in object_list %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.date_field }}</td>
            <td>
                <a href="{% url 'update' item.pk %}" class="btn btn-warning btn-sm">Edit</a>
                <a href="{% url 'delete' item.pk %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center">Нет записей</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
